<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4338CA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C6FEB;stop-opacity:1" />
    </linearGradient>
    <!-- Maskable safe zone: content should be within inner 80% -->
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#grad)" />
  <!-- Graduation cap icon -->
  <g transform="translate(256,256)">
    <!-- Cap board -->
    <polygon points="0,-100 130,0 0,50 -130,0" fill="white" opacity="0.95" />
    <!-- Cap top -->
    <rect x="-20" y="-120" width="40" height="30" rx="5" fill="white" opacity="0.8" />
    <!-- Tassel -->
    <line x1="130" y1="0" x2="130" y2="60" stroke="white" stroke-width="6" opacity="0.8" />
    <circle cx="130" cy="65" r="10" fill="white" opacity="0.8" />
    <!-- Book shape below -->
    <rect x="-70" y="60" width="60" height="75" rx="6" fill="white" opacity="0.6" />
    <rect x="-65" y="60" width="6" height="75" rx="3" fill="rgba(255,255,255,0.4)" />
    <rect x="10" y="60" width="60" height="75" rx="6" fill="white" opacity="0.6" />
    <rect x="64" y="60" width="6" height="75" rx="3" fill="rgba(255,255,255,0.4)" />
  </g>
</svg>
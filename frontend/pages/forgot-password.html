<!doctype html>
<html lang="pt-AO" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f4f6" />
  <meta name="description" content="Recupera o acesso à tua conta Impacta." />
  <title>Recuperar palavra-passe | Impacta</title>
  <link rel="icon" type="image/svg+xml" href="../public/icons/impacta-mark.svg?v=2.5.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" />
  <link rel="stylesheet" href="../assets/css/auth.css?v=2.5.5" />
</head>
<body class="auth-page" data-auth-page="forgot-password">
  <div class="auth-layout">
    <main class="auth-panel">
      <header class="auth-topbar">
        <a class="auth-panel-brand" href="index.html" aria-label="Impacta"><img src="../public/icons/impacta-logo.svg" alt="Impacta" /></a>
        <label class="language-select-wrap">
          <span class="language-globe" aria-hidden="true">◎</span>
          <span class="sr-only" data-auth-copy="language">Idioma</span>
          <select id="language-picker" aria-label="Idioma">
            <option value="pt-AO">Português (Angola)</option>
            <option value="en">English</option>
            <option value="fr">Français</option>
          </select>
        </label>
      </header>

      <section class="auth-card" aria-labelledby="auth-title">
        <div class="auth-card-heading">
          <div>
            <h1 id="auth-title" data-auth-copy="forgotCardTitle">Recuperar palavra-passe</h1>
            <p data-auth-copy="forgotCardText">Indica o email associado à tua conta.</p>
          </div>
        </div>
        <form id="forgot-password-form" class="auth-form" novalidate>
          <label class="auth-field">
            <span data-auth-copy="email">Email</span>
            <span class="auth-input-wrap">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>
              <input name="email" type="email" autocomplete="email" required maxlength="254" placeholder="nome@exemplo.com" data-auth-placeholder="emailPlaceholder" />
            </span>
          </label>
          <p class="auth-status" id="forgot-password-status" role="status" aria-live="polite" hidden></p>
          <button class="auth-submit" type="submit"><span data-auth-copy="sendResetLink">Enviar instruções</span></button>
        </form>
        <div class="auth-switch"><a href="login.html" data-auth-copy="backToLogin">Voltar a entrar</a></div>
      </section>
      <footer class="auth-panel-footer"><span>© <span id="current-year"></span> Impacta</span><span data-auth-copy="footerLine">Feita para aprender em comunidade.</span></footer>
    </main>
  </div>
  <script src="../assets/js/i18n.js?v=2.2.0"></script>
  <script src="../assets/js/i18n-overrides.js?v=2.5.2"></script>
  <script src="../assets/js/auth-pages.js?v=2.3.1"></script>
</body>
</html>

  <!-- Ã¢â€â‚¬Ã¢â€â‚¬ Inline bootstrap: splash + SW Ã¢â€â‚¬Ã¢â€â‚¬ -->
  <script>
    (function () {
      'use strict';

      const bar    = document.getElementById('loader-bar');
      const screen = document.getElementById('loading-screen');

      if (bar) {
        setTimeout(() => { bar.style.width = '40%'; }, 80);
        setTimeout(() => { bar.style.width = '75%'; }, 400);
        setTimeout(() => { bar.style.width = '95%'; }, 800);
      }

      const dismissLoader = () => {
        if (bar) bar.style.width = '100%';
        setTimeout(() => {
          if (screen) {
            screen.style.opacity = '0';
            screen.style.visibility = 'hidden';
            setTimeout(() => screen?.remove(), 500);
          }
        }, 250);
      };

      if (document.readyState === 'complete') {
        setTimeout(dismissLoader, 600);
      } else {
        window.addEventListener('load', () => setTimeout(dismissLoader, 300));
      }

      // Registro do Service Worker PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/Impactaa/frontend/sw.js', {
            scope: '/Impactaa/',
          }).then(reg => {
            reg.update();
          }).catch(err => {
            console.log('[IMPACTA SW] Info:', err);
          });
        });
      }
    })();
  </script>
